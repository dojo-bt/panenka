<title>Panenka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Pixelify's 3, 5 and 7 read as 8, S and a hook: numerals come from Jersey 10 instead, scaled to match */
@font-face { font-family: "Panenka Digits"; font-display: swap; size-adjust: 124%;
  src: url(https://fonts.gstatic.com/s/jersey10/v4/GftH7vZKsggXMf9n_J5n_5jh6V89Sg.woff2) format("woff2");
  unicode-range: U+0030-0039, U+0025, U+002B; }
/* Retro: a 16-bit football game. The stadium is drawn at low resolution and blown up into crisp pixels behind
   menu panels with stepped pixel corners and bevels. Pixelify Sans for every game voice, Barlow for reading. */
:root {
  --night: #0b0a1c;
  --panel: #17163a;
  --panel-2: #201f4c;
  --hi: #34338a;
  --lo: #0e0d26;
  --edge: #050410;
  --chalk: #f6f2e4;
  --dim: #b4b1dd;
  --line: #34337a;
  --flood: #ffc53d;
  --flood-hi: #ffe38a;
  --flood-lo: #b87a0c;
  --flood-ink: #2a1600;
  --red: #ff6a5c;
  --ember: #ff8a3d;
  --grass: #63c74d;
  --px: 4px;
  --f-display: "Panenka Digits", "Pixelify Sans", "Courier New", monospace;
  --f-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "Panenka Digits", "Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--chalk);
  font: 500 17px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 24px;
  caret-color: var(--flood);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--flood); color: var(--flood-ink); }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
/* CRT: faint scanlines over the pitch only, never over the text */
.crt { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; display: grid; gap: 22px; }

/* Pixel panel: stepped corners from four edge shadows, a light bevel on top, a dark one underneath */
.glass {
  background: var(--panel);
  box-shadow:
    inset 0 var(--px) 0 0 var(--hi), inset 0 calc(-1 * var(--px)) 0 0 var(--lo),
    0 calc(-1 * var(--px)) 0 0 var(--edge), 0 var(--px) 0 0 var(--edge),
    calc(-1 * var(--px)) 0 0 0 var(--edge), var(--px) 0 0 0 var(--edge),
    var(--px) calc(3 * var(--px)) 0 0 rgba(0,0,0,.45);
}

/* ---------- Scoreboard ---------- */
.board { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 16px; padding: 12px 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { width: 36px; height: 36px; flex: none; animation: bounce 1.2s steps(2, jump-none) infinite; }
.brand-name { font: 700 30px/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; color: var(--chalk); text-shadow: 3px 3px 0 var(--edge); }
.brand-name span { color: var(--flood); }
.brand-sub { margin-top: 4px; font: 500 13px/1.2 var(--f-mono); color: var(--dim); }
.pips { display: flex; justify-content: center; gap: 8px; }
.pip { width: 26px; height: 26px; flex: none; display: grid; place-items: center; box-sizing: border-box;
  border: 2px solid var(--line); background: var(--lo); font: 600 13px/1 var(--f-mono); color: var(--dim); }
.pip.now { border-color: var(--flood); color: var(--flood); animation: blink 1s steps(1) infinite; }
.pip.done { border: 2px solid var(--edge); animation: pop .4s steps(4) both; box-shadow: inset -3px -3px 0 rgba(0,0,0,.28), inset 3px 3px 0 rgba(255,255,255,.35); }
.streak { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 2px solid var(--line); background: var(--lo); font: 500 13px/1 var(--f-mono); color: var(--dim); white-space: nowrap; }
.streak svg { width: 14px; height: 14px; fill: var(--dim); }
.streak b { font-size: 17px; color: var(--chalk); font-weight: 700; }
.streak.risk { border-color: var(--flood-lo); }
.streak.risk svg { fill: var(--flood); animation: blink 1.2s steps(1) infinite; }
.streak.hot { border-color: var(--ember); background: #3a1a12; }
.streak.hot svg { fill: var(--ember); animation: flick .8s steps(2) infinite; }
.streak.hot b { color: #ffb37a; }
.score { display: flex; align-items: center; gap: 14px; }
.roar { display: grid; gap: 5px; width: 120px; }
.roar .lbl, .score .lbl { font: 500 12px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
.roar .meter { height: 12px; background: var(--lo); border: 2px solid var(--edge); overflow: hidden; }
.roar .meter i { display: block; height: 100%; width: 0; transition: width 1s steps(10);
  background: repeating-linear-gradient(90deg, var(--grass) 0 8px, #3e8948 8px 10px); }
.roar .word { font: 600 13px/1 var(--f-mono); color: var(--chalk); }
.pts-box { text-align: right; }
.pts-box .num { display: block; margin-top: 4px; font: 700 28px/1 var(--f-mono); color: var(--flood); background: #000; padding: 5px 10px 4px;
  border: 2px solid var(--edge); box-shadow: inset 0 0 0 2px #2a1f00; font-variant-numeric: tabular-nums; min-width: 3ch; }
.icon-btn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; padding: 0; border: 2px solid var(--edge); background: var(--panel-2);
  box-shadow: inset 0 3px 0 var(--hi), inset 0 -3px 0 var(--lo); color: var(--chalk); cursor: pointer; }
.icon-btn:hover { background: var(--hi); }
.icon-btn:active { box-shadow: inset 0 3px 0 var(--lo); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .x { display: none; }
.icon-btn[aria-pressed="true"] { color: var(--dim); }
.icon-btn[aria-pressed="true"] .x { display: block; }
.icon-btn[aria-pressed="true"] .wv { display: none; }

/* ---------- Stage ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 450px; gap: 28px; align-items: start; }
.slot { height: calc(100vh - 150px); min-height: 380px; pointer-events: none; }
.side { display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel { position: relative; padding: 26px 24px 24px; display: grid; gap: 14px; min-width: 0; align-content: start; }
/* a strip of kit stripes across the top of the menu */
.panel::before { content: ""; position: absolute; left: 0; right: 0; top: var(--px); height: 6px;
  background: repeating-linear-gradient(90deg, var(--flood) 0 16px, var(--panel) 16px 20px, var(--grass) 20px 36px, var(--panel) 36px 40px, #6fc3ff 40px 56px, var(--panel) 56px 60px, #b48cff 60px 76px, var(--panel) 76px 80px); }
.panel > * { min-width: 0; }
.view-in > * { animation: rise .32s steps(4, jump-end) both; }
.view-in > *:nth-child(2) { animation-delay: .04s; } .view-in > *:nth-child(3) { animation-delay: .08s; }
.view-in > *:nth-child(4) { animation-delay: .12s; } .view-in > *:nth-child(5) { animation-delay: .16s; }
.view-in > *:nth-child(6) { animation-delay: .2s; } .view-in > *:nth-child(n+7) { animation-delay: .24s; }

.eyebrow { font: 600 14px/1.2 var(--f-mono); color: var(--flood); }
.k { font: 500 13px/1.3 var(--f-mono); color: var(--dim); }
.k b { color: var(--chalk); font-variant-numeric: tabular-nums; }
h1, h2 { font-family: var(--f-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: 0; }
h1 { font-weight: 700; font-size: clamp(32px, 3.3vw, 44px); text-shadow: 3px 3px 0 var(--edge); }
h1 em { font-style: normal; color: var(--flood); }
h2 { font-weight: 600; font-size: clamp(25px, 2.2vw, 31px); text-shadow: 2px 2px 0 var(--edge); }
p { margin: 0; max-width: 62ch; }
.muted { color: var(--dim); font-size: 15px; }
.hook { color: var(--flood); font-weight: 600; }

/* Tier ladder */
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ladder li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 7px 10px; background: var(--lo); font-size: 16px; }
.ladder li:nth-child(even) { background: #131234; }
.ladder li:hover { background: var(--panel-2); }
.ladder li:hover .sw { animation: blink .5s steps(1) infinite; }
.ladder .sw { width: 14px; height: 14px; background: var(--c); box-shadow: inset -3px -3px 0 rgba(0,0,0,.3); }
.ladder .nm { font-weight: 700; }
.ladder .th, .ladder .pt { font: 500 13px/1 var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ladder .pt { color: var(--c); font-weight: 700; min-width: 3ch; font-size: 15px; }
details.how summary { cursor: pointer; font: 500 14px/1 var(--f-mono); color: var(--dim); padding: 6px 0; }
details.how summary:hover { color: var(--chalk); }
details.how[open] summary { margin-bottom: 8px; }

/* Controls: chunky cartridge-era buttons */
.btn {
  position: relative;
  font: 700 22px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em;
  background: var(--flood); color: var(--flood-ink); border: 0; border-radius: 0;
  padding: 14px 24px 16px; cursor: pointer; justify-self: start;
  box-shadow:
    inset 0 3px 0 var(--flood-hi), inset 0 -5px 0 var(--flood-lo),
    0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge);
}
.btn:hover { background: #ffd35e; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 5px 0 var(--flood-lo), 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
.btn.big { font-size: 28px; padding: 16px 30px 19px; }
.btn.big:not(:active) { animation: nudge 1.6s steps(1) infinite; }
.btn.ghost { background: var(--panel-2); color: var(--chalk); font-size: 17px; padding: 11px 16px 13px;
  box-shadow: inset 0 3px 0 var(--hi), inset 0 -4px 0 var(--lo), 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
.btn.ghost:hover { background: var(--hi); }
.btn.ghost:active { box-shadow: inset 0 4px 0 var(--lo), 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
.btn.sm { font-size: 16px; padding: 9px 14px 11px; }
.btn:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible, .icon-btn:focus-visible { outline: 3px dashed var(--chalk); outline-offset: 5px; }
.btn-row { display: flex; gap: 12px 16px; flex-wrap: wrap; align-items: center; }
.answer-row { display: flex; gap: 14px; flex-wrap: wrap; }
.answer-row input { flex: 1 1 210px; min-width: 0; font: 600 21px/1 var(--f-body); color: var(--chalk); background: #07061a; border: 3px solid var(--edge); border-radius: 0;
  box-shadow: inset 0 3px 0 #000, 0 0 0 2px var(--line); padding: 13px 14px; }
.answer-row input:focus { box-shadow: inset 0 3px 0 #000, 0 0 0 2px var(--flood); outline: none; }
.answer-row input::placeholder { color: var(--dim); opacity: .75; }
.answer-row input.shake { animation: shake .3s steps(6); box-shadow: inset 0 3px 0 #000, 0 0 0 2px var(--red); }
.count-chip { font: 500 14px/1.3 var(--f-mono); color: var(--dim); }
.count-chip b { color: var(--chalk); }

/* Question */
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.q-meta { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.topic { font: 600 14px/1 var(--f-body); padding: 5px 10px 6px; background: var(--flood); color: var(--flood-ink); box-shadow: 0 0 0 2px var(--edge); text-transform: uppercase; letter-spacing: .04em; }
.ring { position: relative; width: 58px; height: 58px; flex: none; display: grid; place-items: center; background: #000; box-shadow: 0 0 0 3px var(--edge); }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring rect { fill: none; stroke-width: 6; shape-rendering: crispEdges; }
.ring .rb { stroke: #24233f; }
.ring .rf { stroke: var(--grass); stroke-linecap: butt; stroke-dasharray: 119.4; transition: stroke-dashoffset .12s linear; }
.ring b { position: relative; font: 700 22px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--grass); }
.ring.low { animation: blink .5s steps(1) infinite; }
.ring.low .rf { stroke: var(--red); }
.ring.low b { color: var(--red); }
.feedback:empty, .tries:empty { display: none; }
.feedback .bad { color: var(--red); font-size: 16px; }
.suggest { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; background: #2a2208; box-shadow: 0 0 0 2px var(--flood-lo); animation: rise .2s steps(3) both; }
.suggest b { color: var(--flood); }
.tries { display: flex; flex-wrap: wrap; gap: 8px; }
.tries span { font-size: 14px; text-decoration: line-through; color: var(--dim); padding: 3px 10px; background: var(--lo); border: 2px solid var(--line); overflow-wrap: anywhere; }

/* Result */
.stamp { justify-self: start; font: 700 clamp(30px, 3.2vw, 42px)/1 var(--f-display); text-transform: uppercase; color: var(--edge); background: var(--c); padding: 8px 16px 10px;
  box-shadow: inset 0 4px 0 rgba(255,255,255,.35), inset 0 -5px 0 rgba(0,0,0,.25), 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge); }
.view-in > .stamp { animation: stamp .45s steps(5) both; }
.ptsbig { font: 700 clamp(56px, 5.6vw, 76px)/.9 var(--f-display); color: var(--c); font-variant-numeric: tabular-nums; text-shadow: 4px 4px 0 var(--edge); }
.view-in > .ptsbig { animation: popin .4s .1s steps(4) both; }
.ptsbig small { font-size: .32em; margin-left: 6px; }
.rarity { display: grid; gap: 4px; padding: 12px; background: var(--lo); box-shadow: 0 0 0 2px var(--line); }
.rarity-top { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
.rarity-top span:first-child { font-weight: 700; font-size: 19px; overflow-wrap: anywhere; min-width: 0; }
.rarity-top span:last-child { font: 600 14px/1 var(--f-mono); color: var(--flood); font-variant-numeric: tabular-nums; }
.rarity-bar, .rank-bar { height: 12px; background: #07061a; border: 2px solid var(--edge); overflow: hidden; margin-block: 4px 2px; }
.rarity-bar i, .rank-bar i { display: block; height: 100%; width: 0; transition: width 1.1s steps(12);
  background: repeating-linear-gradient(90deg, var(--flood) 0 8px, var(--flood-lo) 8px 10px); }
.rarity-msg { font: 500 13px/1.3 var(--f-mono); color: var(--dim); }
.auto { height: 6px; background: var(--lo); overflow: hidden; }
.auto i { display: block; height: 100%; width: 0; background: var(--dim); animation: fill 3.6s steps(24) forwards; }
.why { display: grid; gap: 4px; padding: 12px 14px; background: #2a2208; box-shadow: 0 0 0 2px var(--flood-lo); }
.why-k { font: 600 14px/1.3 var(--f-mono); color: var(--flood); }
.why p { font-size: 15px; line-height: 1.4; }

/* Career: rank, form guide, badges */
.career { display: grid; gap: 10px; padding: 12px; background: var(--lo); box-shadow: 0 0 0 2px var(--line); }
.rank-top { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
.rank-name { font: 700 22px/1 var(--f-display); text-transform: uppercase; }
.rank-next { font: 500 13px/1.3 var(--f-mono); color: var(--dim); }
.form { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.fchip { display: grid; gap: 5px; justify-items: center; padding: 8px 2px; background: var(--panel-2); border: 2px solid var(--edge); }
.fchip b { font: 700 16px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.fchip small { font: 500 11px/1 var(--f-mono); text-transform: uppercase; color: var(--dim); }
.fchip.g4 b { color: #ffc53d; } .fchip.g3 b { color: #7ee08a; } .fchip.g2 b { color: #6fc3ff; } .fchip.g1 b { color: #d39a5b; }
.fchip.miss { background: none; border: 2px dashed var(--line); opacity: .7; }
.fchip.today { border-color: var(--flood); animation: blink 1s steps(1) infinite; }
.fchip.today b { color: var(--flood); }
.topics, .cabinet { display: grid; gap: 8px; }
.chips, .badges { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 13px/1 var(--f-body); padding: 6px 10px; background: var(--panel-2); border: 2px solid var(--edge); }
.chip.more { color: var(--dim); border-style: dashed; border-color: var(--line); background: none; }
.badge { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--f-body); padding: 6px 10px 6px 8px; border: 2px dashed var(--line); color: var(--dim); }
.badge::before { content: ""; width: 10px; height: 10px; border: 2px solid currentColor; box-sizing: border-box; opacity: .6; }
.badge.on { border: 2px solid var(--flood-lo); color: var(--chalk); background: #2a2208; }
.badge.on::before { background: var(--flood); border-color: var(--edge); opacity: 1; }
.badge.new { animation: popin .4s .4s steps(4) both; }
.next-badge { font: 500 13px/1.4 var(--f-mono); color: var(--dim); }
.motm { display: grid; gap: 3px; padding: 12px 14px; background: color-mix(in srgb, var(--c) 14%, var(--lo)); box-shadow: 0 0 0 2px var(--c); }
.motm b { font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.motm small { font: 500 13px/1.3 var(--f-mono); color: var(--c); }
.promo { justify-self: start; padding: 8px 12px; background: var(--flood); color: var(--flood-ink); font: 700 19px/1 var(--f-display); text-transform: uppercase;
  box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }

/* Full time */
.ft-score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ft-score .big { font: 700 clamp(66px, 6.6vw, 92px)/.85 var(--f-display); color: var(--flood); font-variant-numeric: tabular-nums; text-shadow: 5px 5px 0 var(--edge); }
.ft-score .of { font: 500 16px/1.3 var(--f-mono); color: var(--dim); }
.ans-list { display: grid; gap: 6px; }
details.ans { background: var(--lo); box-shadow: 0 0 0 2px var(--edge); }
details.ans[open] { background: #0a0920; }
details.ans summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0,1fr) auto 14px; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; }
details.ans summary::-webkit-details-marker { display: none; }
details.ans summary:hover { background: var(--panel-2); }
details.ans .n { width: 26px; height: 26px; display: grid; place-items: center; background: var(--c); color: var(--edge); font: 700 14px/1 var(--f-mono); box-shadow: inset -3px -3px 0 rgba(0,0,0,.25); }
details.ans .q b { display: block; overflow-wrap: anywhere; }
details.ans .q small { display: block; color: var(--dim); font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
details.ans .t { text-align: right; font: 600 13px/1.35 var(--f-mono); color: var(--c); white-space: nowrap; }
details.ans .t em { display: block; font-style: normal; color: var(--chalk); }
details.ans .chev { width: 14px; height: 14px; color: var(--dim); }
details.ans[open] .chev { transform: rotate(180deg); color: var(--chalk); }
details.ans .why { margin: 8px 8px 4px; }
details.ans[open] .why, details.ans[open] .alist { animation: drop .2s steps(3) both; }
.asearch { margin: 8px 8px 0; display: grid; gap: 6px; }
.search { display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #07061a; border: 2px solid var(--line); }
.search:focus-within { border-color: var(--flood); }
.search svg { width: 16px; height: 16px; flex: none; color: var(--dim); }
.search:focus-within svg { color: var(--flood); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--chalk); font: 600 16px/1 var(--f-body); padding: 9px 0; }
.search input::placeholder { color: var(--dim); opacity: .8; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { flex: none; background: none; border: 0; color: var(--dim); font: 500 13px/1 var(--f-mono); cursor: pointer; padding: 6px 2px; }
.search .clear:hover, .search .clear:focus-visible { color: var(--chalk); }
.srch-res { font: 500 13px/1.3 var(--f-mono); color: var(--dim); margin: 0 2px; }
.srch-res:empty { display: none; }
.alist { list-style: none; margin: 0; padding: 6px 8px 10px; display: grid; gap: 0; max-height: 320px; overflow-y: auto; scrollbar-color: var(--hi) var(--lo); scrollbar-width: thin; }
.alist::-webkit-scrollbar { width: 10px; } .alist::-webkit-scrollbar-track { background: var(--lo); } .alist::-webkit-scrollbar-thumb { background: var(--hi); border: 2px solid var(--lo); }
.alist li { display: grid; grid-template-columns: 8px minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 5px 8px; font-size: 15px; }
.alist li:nth-child(odd) { background: rgba(255,255,255,.035); }
.alist li i { width: 8px; height: 8px; background: var(--c); }
.alist .nm { overflow-wrap: anywhere; }
.alist .tn { font: 500 12px/1 var(--f-mono); color: var(--c); white-space: nowrap; }
.alist .pc { font: 500 13px/1 var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; min-width: 5.5ch; text-align: right; }
.alist li.me { background: #3a2c06; box-shadow: inset 0 0 0 2px var(--flood-lo); }
.alist li.me .nm { color: var(--flood); font-weight: 700; }
.alist li.hit .nm { font-weight: 700; }
.alist li[hidden], .why[hidden], .search .clear[hidden] { display: none; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stats div { background: var(--lo); border: 2px solid var(--edge); padding: 10px; }
.stats b { display: block; font: 700 22px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stats span { font: 500 12px/1.3 var(--f-mono); color: var(--dim); }
.share { width: 100%; box-sizing: border-box; resize: none; overflow: hidden; font: 500 14px/1.5 var(--f-mono); background: #07061a; color: var(--chalk); border: 2px solid var(--line); border-radius: 0; padding: 10px; }
.toast { font: 600 14px/1 var(--f-mono); color: var(--grass); }

.foot { font: 500 14px/1.4 var(--f-body); color: var(--dim); text-align: center; max-width: none; text-shadow: 2px 2px 0 #000; }

@keyframes bounce { 50% { transform: translateY(-3px); } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes nudge { 0%, 70% { transform: none; } 80% { transform: translateY(-2px); } 90% { transform: none; } }
@keyframes pop { 0% { transform: scale(.25); } 100% { transform: scale(1); } }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes stamp { 0% { transform: scale(1.8); opacity: 0; } 70% { transform: scale(.94); opacity: 1; } 100% { transform: scale(1); } }
@keyframes popin { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes fill { to { width: 100%; } }
@keyframes drop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flick { 50% { transform: scale(1.2); } }

  const end = (hit, raw, why) => { if (over) return; over = true; clearInterval(qTimer); shoot(hit, raw, why); };
  const tick = () => {
    const left = TIME - (Date.now() - t0) / 1000;

function shoot(hit, raw, why) {
  if (G.busy) return; G.busy = true;
  const i = G.answers.length, Q = BANK[G.qs[i]];
  const t = hit ? tierOf(Q, hit) : ROWZ;
  const ans = { raw: (raw || "").trim(), name: hit ? hit.name : null, pct: hit ? hit.pct : null, tier: t.id, why: hit ? null : (why || "pass") };
  G.cur = null; save(ans);
  setPanel(`
    <span class="eyebrow">Question ${i + 1} of 7</span>
    <h2>${hit ? esc(hit.name) : why === "time" ? "Out of time" : "Passed"}</h2>
    <p class="muted">${hit ? "Stepping up to the spot…" : "Panicking at the spot…"}</p>`);
  toTop();
  let fin = false;
  const finish = () => { if (fin) return; fin = true; G.answers.push(ans); G.busy = false; renderBoard(-1); showResult(i, ans); };
  scene.play(t.id, finish);

  for (let i = 0; i < 32768; i++) {
    const r = (i >> 10) * 8.23, g = ((i >> 5) & 31) * 8.23, b = (i & 31) * 8.23;
    let best = 0, bd = 1e9;
    RETRO_PAL.forEach((c, k) => { const d = 2 * (r - c[0]) ** 2 + 4 * (g - c[1]) ** 2 + 3 * (b - c[2]) ** 2; if (d < bd) { bd = d; best = k; } });
    const c = RETRO_PAL[best]; lut[i] = (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0];
  }
  return lut;
})();
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - .47) * 22);
function retroPass() {
  const w = cv.width, h = cv.height; if (!w || !h) return;
  const img = ctx.getImageData(0, 0, w, h), px = new Uint32Array(img.data.buffer);
  for (let y = 0; y < h; y++) {
    const row = y * w, by = (y & 3) << 2;
    for (let x = 0; x < w; x++) {
      const v = px[row + x], o = BAYER[by | (x & 3)];
      let r = (v & 255) + o, g = ((v >> 8) & 255) + o, b = ((v >> 16) & 255) + o;
      r = r < 0 ? 0 : r > 255 ? 255 : r; g = g < 0 ? 0 : g > 255 ? 255 : g; b = b < 0 ? 0 : b > 255 ? 255 : b;
      px[row + x] = RETRO_LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)];
    }
  }
  ctx.putImageData(img, 0, 0);
}

let last = performance.now(), ambT = 0;
function frame(real) {
  const dtR = Math.min(.05, Math.max(0, (real - last) / 1000)); last = real;
  // slow motion as the Panenka chip floats over the diving keeper
  const s0 = scene.shot; let tsT = 1;
  if (s0 && !REDUCE && s0.tier === "top") { const p = (clock - s0.contact) / s0.flight; if (p > .5 && p < 1.02) tsT = .3; }
  scene.ts += (tsT - scene.ts) * Math.min(1, dtR * 16);
  if (!scene.frozen) clock += dtR * 1000 * scene.ts;
  const now = clock, dt = dtR * scene.ts;
  scene.excite = Math.max(0, scene.excite - dtR * .22);
  scene.atmo += (scene.atmoT - scene.atmo) * Math.min(1, dtR * 1.2);
  scene.cam.z += (scene.cam.zt - scene.cam.z) * Math.min(1, dtR * (REDUCE ? 20 : 2.4));
  if ((ambT += dtR) > .4) { ambT = 0; SFX.atmo(scene.atmo + scene.excite * .8); }

  const g = geo(), kst = keeperState(now), b = ballState(now, kst);
  scene.cam.x += ((REDUCE || b.rest ? 0 : (b.x - W / 2) * .16) - scene.cam.x) * Math.min(1, dtR * 4);
  if (b.trail && !REDUCE) { scene.trail.push({ x: b.x, y: b.y, r: b.r }); if (scene.trail.length > 16) scene.trail.shift(); }
  else if (scene.trail.length) scene.trail.shift();
  if (scene.fireworks && !REDUCE && Math.random() < .012 + scene.fireworks * .03) {
    const fx = lerp(B.x0 + 60, B.x1 - 60, Math.random()), fy = lerp(Math.max(B.y0, standTop) + 50, g.standB - 110, Math.random());
    const col = ["#ffc53d", "#eef3ea", "#7ee08a", "#ff8a3d", "#6fc3ff"][Math.floor(Math.random() * 5)];
    spawn(34, i => { const a = i / 34 * 6.283, v = 90 + Math.random() * 90; return { x: fx, y: fy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 90, life: 1, dec: .8 + Math.random() * .4, size: 2.5 + Math.random() * 2, col, rot: 0, glow: true }; });

  const sc = fit.sc * scene.cam.z;

  B = { x0: -ox / sc, x1: (cw - ox) / sc, y0: -oy / sc, y1: (ch - oy) / sc };
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#05110b"; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  drawStands(now); drawBeams(real); drawHoarding(now); drawPitch();
  drawNet(now);
  if (b.behind) { drawTrail(); drawBall(b); }
  drawKeeper(kst);
  drawPosts();
  drawShadow(b, g);
  if (!b.behind && !b.rest) { drawTrail(); drawBall(b); }
  drawStriker(now);
  if (b.rest) drawBall(b);
  drawRings(now);
  drawParticles(dt);
  drawPops(now);
  drawBanner(now);
  // screen-space finish
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const vg = ctx.createRadialGradient(fit.cx, fit.cy, Math.min(cw, ch) * .25, fit.cx, fit.cy, Math.max(cw, ch) * .85);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cw, ch);
  if (scene.urgent) edgeGlow("255,60,40", REDUCE ? .12 : .1 + .1 * Math.sin(real / 150));
  if (scene.ts < .9) edgeGlow("255,197,61", (1 - scene.ts) * .32);
  if (scene.excite > .6 && !REDUCE) { ctx.fillStyle = `rgba(255,240,200,${((scene.excite - .6) * .22).toFixed(3)})`; ctx.fillRect(0, 0, cw, ch); }
  retroPass();
  requestAnimationFrame(frame);
}
