<title>Panenka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: the whole page is the floodlit stadium (fixed canvas). Glass scoreboard on top, glass match card floating right on desktop, below the goal view on phones. Single dark look by choice. */
:root {
  --night: #05110b;
  --glass: rgba(6, 18, 12, .76);
  --chalk: #eef3ea;
  --dim: #a3b8aa;
  --line: rgba(238, 243, 234, .13);
  --flood: #ffc53d;
  --flood-ink: #2a1d00;
  --red: #ff7a6b;
  --ember: #ff8a3d;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "Martian Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--night);
  color: var(--chalk);
  font: 500 17px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25);
  border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 24px 60px -24px rgba(0,0,0,.8);
}

/* ---------- Scoreboard ---------- */
.board { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 16px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 36px; height: 36px; flex: none; animation: spin 8s linear infinite; filter: drop-shadow(0 0 10px rgba(255,197,61,.35)); }
.brand-name { font: 900 32px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand-name span { color: var(--flood); }
.brand-sub { font: 400 10px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.pips { display: flex; justify-content: center; gap: 8px; }
.pip { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px dashed rgba(238,243,234,.28); display: grid; place-items: center; font: 600 10px/1 var(--f-mono); color: var(--dim); box-sizing: border-box; }
.pip.now { border-style: solid; border-color: var(--flood); color: var(--flood); animation: pulse 1.6s ease-in-out infinite; }
.pip.done { border: 0; animation: pop .5s cubic-bezier(.3,1.7,.5,1); box-shadow: 0 0 12px -2px currentColor; }
.streak { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0,0,0,.3); font: 600 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.streak svg { width: 14px; height: 14px; fill: var(--dim); transform-origin: 50% 90%; }
.streak b { font-size: 14px; color: var(--chalk); letter-spacing: 0; }
.streak.risk { border-color: rgba(255,197,61,.5); }
.streak.risk svg { fill: var(--flood); animation: flick 1.2s ease-in-out infinite; }
.streak.hot { border-color: rgba(255,138,61,.6); background: rgba(255,110,50,.14); }
.streak.hot svg { fill: var(--ember); animation: flick .8s ease-in-out infinite; }
.streak.hot b { color: #ffb37a; }
.score { display: flex; align-items: center; gap: 12px; }
.roar { display: grid; gap: 5px; width: 116px; }
.roar .lbl, .score .lbl { font: 600 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.roar .meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.roar .meter i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #2f7a54, var(--flood) 60%, var(--red)); transition: width 1s cubic-bezier(.2,.9,.2,1); }
.roar .word { font: 600 11px/1 var(--f-mono); color: var(--chalk); }
.pts-box { text-align: right; }
.pts-box .num { display: block; margin-top: 4px; font: 600 28px/1 var(--f-mono); color: var(--flood); background: #000; padding: 5px 10px; border-radius: 4px; text-shadow: 0 0 12px rgba(255,197,61,.5); font-variant-numeric: tabular-nums; }
.icon-btn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--chalk); cursor: pointer; transition: background .15s ease; }
.icon-btn:hover { background: rgba(255,255,255,.1); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .x { display: none; }
.icon-btn[aria-pressed="true"] { color: var(--dim); }
.icon-btn[aria-pressed="true"] .x { display: block; }
.icon-btn[aria-pressed="true"] .wv { display: none; }

/* ---------- Stage ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 24px; align-items: start; }
.slot { height: calc(100vh - 140px); min-height: 380px; pointer-events: none; }
.side { display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel { position: relative; padding: 22px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel::before { content: ""; position: absolute; inset: -1px 18px auto; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--flood), transparent); opacity: .8; }
.panel > * { min-width: 0; }
.view-in > * { animation: rise .5s cubic-bezier(.2,.9,.25,1.15) both; }
.view-in > *:nth-child(2) { animation-delay: .05s; } .view-in > *:nth-child(3) { animation-delay: .1s; }
.view-in > *:nth-child(4) { animation-delay: .15s; } .view-in > *:nth-child(5) { animation-delay: .2s; }
.view-in > *:nth-child(6) { animation-delay: .25s; } .view-in > *:nth-child(n+7) { animation-delay: .3s; }

.eyebrow { font: 600 11px/1.3 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--flood); }
.k { font: 600 10px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.k b { color: var(--chalk); font-variant-numeric: tabular-nums; }
h1, h2 { font-family: var(--f-display); text-transform: uppercase; line-height: .94; margin: 0; text-wrap: balance; }
h1 { font-weight: 900; font-size: clamp(36px, 3.9vw, 50px); }
h1 em { font-style: normal; background: linear-gradient(100deg, var(--flood) 30%, #fff3c4 50%, var(--flood) 70%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 3.6s linear infinite; }
h2 { font-weight: 800; font-size: clamp(28px, 2.6vw, 36px); }
p { margin: 0; max-width: 62ch; }
.muted { color: var(--dim); font-size: 15px; }
.hook { color: var(--flood); font-weight: 600; }

/* Tier ladder */
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.ladder li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.035); font-size: 15px; transition: transform .2s ease, background .2s ease; }
.ladder li:hover { transform: translateX(4px); background: rgba(255,255,255,.07); }
.ladder .sw { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px -1px var(--c); }
.ladder .nm { font-weight: 700; }
.ladder .th, .ladder .pt { font: 400 11px/1 var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ladder .pt { color: var(--c); font-weight: 600; min-width: 3.5ch; }
details.how summary { cursor: pointer; font: 600 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 6px 0; }
details.how[open] summary { margin-bottom: 8px; }

/* Controls */
.btn {
  position: relative; overflow: hidden;
  font: 800 21px/1 var(--f-display); text-transform: uppercase; letter-spacing: .05em;
  background: var(--flood); color: var(--flood-ink); border: 0; border-radius: 6px;
  padding: 14px 24px; cursor: pointer; justify-self: start;
  box-shadow: 0 6px 0 -1px #a0760f, 0 12px 28px -8px rgba(255,197,61,.55);
  transition: transform .12s ease, box-shadow .12s ease, filter .15s ease;
}
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.5) 50%, transparent 60%); transform: translateX(-120%); animation: shine 3.4s ease-in-out infinite; pointer-events: none; }
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 -1px #a0760f; }
.btn.big { font-size: 26px; padding: 16px 30px; }
.btn.ghost { background: rgba(255,255,255,.04); color: var(--chalk); border: 1px solid var(--line); box-shadow: none; font-size: 17px; padding: 12px 16px; }
.btn.ghost::after { content: none; }
.btn.ghost:active { transform: translateY(1px); }
.btn.sm { font-size: 16px; padding: 9px 14px; box-shadow: 0 4px 0 -1px #a0760f; }
.btn.ghost.sm { box-shadow: none; }
.btn:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.btn-row { display: flex; gap: 10px 12px; flex-wrap: wrap; align-items: center; }
.answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
.answer-row input { flex: 1 1 210px; min-width: 0; font: 600 21px/1 var(--f-body); color: var(--chalk); background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 6px; padding: 13px 14px; transition: border-color .15s ease, box-shadow .15s ease; }
.answer-row input:focus { border-color: var(--flood); box-shadow: 0 0 0 3px rgba(255,197,61,.18); outline: none; }
.answer-row input::placeholder { color: var(--dim); opacity: .7; }
.answer-row input.shake { animation: shake .35s; border-color: var(--red); }
.count-chip { font: 600 11px/1.3 var(--f-mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.count-chip b { color: var(--chalk); }

/* Question */
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.q-meta { display: grid; gap: 7px; justify-items: start; min-width: 0; }
.topic { font: 600 13px/1 var(--f-body); padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(255,197,61,.4); background: rgba(255,197,61,.08); color: var(--chalk); }
.ring { position: relative; width: 54px; height: 54px; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .rb { stroke: rgba(255,255,255,.1); }
.ring .rf { stroke: var(--flood); stroke-linecap: round; stroke-dasharray: 119.4; transition: stroke-dashoffset .12s linear; filter: drop-shadow(0 0 4px rgba(255,197,61,.7)); }
.ring b { position: relative; font: 600 19px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.ring.low { animation: tick 1s ease-in-out infinite; }
.ring.low .rf { stroke: var(--red); filter: drop-shadow(0 0 5px rgba(255,122,107,.8)); }
.ring.low b { color: var(--red); }
.feedback:empty, .tries:empty { display: none; }
.feedback .bad { color: var(--red); font-size: 16px; }
.suggest { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid rgba(255,197,61,.45); background: rgba(255,197,61,.08); border-radius: 6px; animation: rise .3s ease both; }
.suggest b { color: var(--flood); }
.tries { display: flex; flex-wrap: wrap; gap: 6px; }
.tries span { font-size: 14px; text-decoration: line-through; color: var(--dim); padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; overflow-wrap: anywhere; }

/* Result */
.stamp { justify-self: start; font: 900 clamp(34px, 3.6vw, 48px)/1 var(--f-display); text-transform: uppercase; color: var(--c); border: 3px solid var(--c); padding: 6px 14px 4px; border-radius: 6px; transform: rotate(-3deg); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 50%, transparent); box-shadow: 0 0 30px -10px var(--c); }
.view-in > .stamp { animation: stamp .6s cubic-bezier(.2,1.4,.4,1) both; }
.ptsbig { font: 900 clamp(60px, 6vw, 80px)/.9 var(--f-display); color: var(--c); font-variant-numeric: tabular-nums; }
.view-in > .ptsbig { animation: popin .6s .15s cubic-bezier(.2,1.6,.4,1) both; }
.ptsbig small { font-size: .32em; margin-left: 6px; letter-spacing: .04em; }
.rarity { display: grid; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,.3); }
.rarity-top { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
.rarity-top span:first-child { font-weight: 700; font-size: 19px; overflow-wrap: anywhere; min-width: 0; }
.rarity-top span:last-child { font: 600 12px/1 var(--f-mono); color: var(--flood); font-variant-numeric: tabular-nums; }
.rarity-bar, .rank-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin-block: 4px 2px; }
.rarity-bar i, .rank-bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #d79a1c, var(--flood)); transition: width 1.1s cubic-bezier(.2,.9,.2,1); }
.rarity-msg { font: 400 11px/1.3 var(--f-mono); color: var(--dim); }
.auto { height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.auto i { display: block; height: 100%; width: 0; background: var(--dim); animation: fill 3.6s linear forwards; }
.why { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid rgba(255,197,61,.4); background: linear-gradient(135deg, rgba(255,197,61,.14), rgba(255,197,61,.04)); border-radius: 6px; }
.why-k { font: 600 10px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--flood); }
.why p { font-size: 15px; line-height: 1.4; }

/* Career: rank, form guide, badges, teamsheet */
.career { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,.3); }
.rank-top { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
.rank-name { font: 800 22px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.rank-next { font: 400 11px/1.3 var(--f-mono); color: var(--dim); }
.form { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.fchip { display: grid; gap: 4px; justify-items: center; padding: 7px 2px; border-radius: 6px; background: rgba(255,255,255,.05); border: 1px solid transparent; }
.fchip b { font: 600 14px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.fchip small { font: 400 9px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.fchip.g4 b { color: #ffc53d; } .fchip.g3 b { color: #7ee08a; } .fchip.g2 b { color: #6fc3ff; } .fchip.g1 b { color: #d39a5b; }
.fchip.miss { background: none; border: 1px dashed var(--line); opacity: .6; }
.fchip.today { border: 1px solid var(--flood); animation: pulse 1.6s ease-in-out infinite; }
.fchip.today b { color: var(--flood); }
.topics, .cabinet { display: grid; gap: 8px; }
.chips, .badges { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px/1 var(--f-body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }
.chip.more { color: var(--dim); border-style: dashed; background: none; }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--f-body); padding: 6px 10px 6px 8px; border-radius: 999px; border: 1px dashed var(--line); color: var(--dim); }
.badge::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; box-sizing: border-box; opacity: .6; }
.badge.on { border: 1px solid rgba(255,197,61,.55); color: var(--chalk); background: rgba(255,197,61,.1); }
.badge.on::before { background: var(--flood); border-color: var(--flood); box-shadow: 0 0 8px var(--flood); opacity: 1; }
.badge.new { animation: popin .6s .4s cubic-bezier(.2,1.6,.4,1) both; box-shadow: 0 0 18px -4px var(--flood); }
.next-badge { font: 400 11px/1.4 var(--f-mono); color: var(--dim); }
.motm { display: grid; gap: 3px; padding: 10px 12px; border-left: 4px solid var(--c); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 16%, transparent), transparent); border-radius: 6px; }
.motm b { font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.motm small { font: 400 11px/1.3 var(--f-mono); color: var(--c); }
.promo { justify-self: start; padding: 8px 12px 6px; border-radius: 6px; background: var(--flood); color: var(--flood-ink); font: 800 19px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; box-shadow: 0 0 30px -6px var(--flood); }

/* Full time */
.ft-score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ft-score .big { font: 900 clamp(70px, 7vw, 96px)/.85 var(--f-display); color: var(--flood); font-variant-numeric: tabular-nums; text-shadow: 0 0 34px rgba(255,197,61,.4); }
.ft-score .of { font: 600 14px/1.3 var(--f-mono); color: var(--dim); }
.ans-list { display: grid; gap: 6px; }
details.ans { background: rgba(0,0,0,.28); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; transition: background .2s ease; }
details.ans[open] { background: rgba(0,0,0,.42); }
details.ans summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0,1fr) auto 14px; gap: 10px; align-items: center; padding: 10px 12px; }
details.ans summary::-webkit-details-marker { display: none; }
details.ans summary:hover { background: rgba(255,255,255,.04); }
details.ans .n { font: 600 11px/1 var(--f-mono); color: var(--dim); }
details.ans .q b { display: block; overflow-wrap: anywhere; }
details.ans .q small { display: block; color: var(--dim); font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
details.ans .t { text-align: right; font: 600 11px/1.4 var(--f-mono); color: var(--c); white-space: nowrap; }
details.ans .t em { display: block; font-style: normal; color: var(--chalk); }
details.ans .chev { width: 14px; height: 14px; color: var(--dim); transition: transform .25s ease; }
details.ans[open] .chev { transform: rotate(180deg); color: var(--chalk); }
details.ans .why { margin: 8px 8px 4px; }
details.ans[open] .why, details.ans[open] .alist { animation: drop .35s ease both; }
.asearch { margin: 8px 8px 0; display: grid; gap: 6px; }
.search { display: flex; align-items: center; gap: 10px; padding: 0 10px; background: rgba(0,0,0,.42); border: 1px solid var(--line); border-radius: 6px; transition: border-color .15s ease, box-shadow .15s ease; }
.search:focus-within { border-color: var(--flood); box-shadow: 0 0 0 3px rgba(255,197,61,.18); }
.search svg { width: 16px; height: 16px; flex: none; color: var(--dim); }
.search:focus-within svg { color: var(--flood); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--chalk); font: 600 16px/1 var(--f-body); padding: 9px 0; }
.search input::placeholder { color: var(--dim); opacity: .75; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { flex: none; background: none; border: 0; color: var(--dim); font: 600 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; padding: 6px 2px; }
.search .clear:hover, .search .clear:focus-visible { color: var(--chalk); }
.srch-res { font: 600 11px/1.3 var(--f-mono); color: var(--dim); letter-spacing: .06em; margin: 0 2px; }
.srch-res:empty { display: none; }
.alist { list-style: none; margin: 0; padding: 6px 8px 10px; display: grid; gap: 2px; max-height: 320px; overflow-y: auto; }
.alist li { display: grid; grid-template-columns: 8px minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 4px 8px; border-radius: 4px; font-size: 15px; }
.alist li:nth-child(odd) { background: rgba(255,255,255,.025); }
.alist li i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.alist .nm { overflow-wrap: anywhere; }
.alist .tn { font: 400 10px/1 var(--f-mono); color: var(--c); white-space: nowrap; }
.alist .pc { font: 400 11px/1 var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; min-width: 5.5ch; text-align: right; }
.alist li.me { background: rgba(255,197,61,.16); outline: 1px solid rgba(255,197,61,.4); }
.alist li.me .nm { color: var(--flood); font-weight: 700; }
.alist li.hit .nm { font-weight: 700; }
.alist li[hidden], .why[hidden], .search .clear[hidden] { display: none; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stats div { background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.stats b { display: block; font: 600 20px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stats span { font: 400 10px/1.3 var(--f-mono); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.share { width: 100%; box-sizing: border-box; resize: none; overflow: hidden; font: 400 13px/1.5 var(--f-mono); background: rgba(0,0,0,.35); color: var(--chalk); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.toast { font: 600 12px/1 var(--f-mono); color: #7ee08a; }

.foot { font-size: 13px; color: var(--dim); text-align: center; max-width: none; text-shadow: 0 1px 6px #000; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255,197,61,.18); } }
@keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
@keyframes rise { from { transform: translateY(14px); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes stamp { 0% { transform: scale(2) rotate(-12deg); opacity: .2; } 60% { transform: scale(.94) rotate(-2deg); opacity: 1; } 100% { transform: scale(1) rotate(-3deg); } }
@keyframes popin { 0% { transform: scale(.4); opacity: .2; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes tick { 50% { transform: scale(1.12); } }
@keyframes fill { to { width: 100%; } }
@keyframes drop { from { transform: translateY(-6px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes flick { 50% { transform: scale(1.2) rotate(-5deg); } }
@keyframes shine { 0%, 62% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
@keyframes sheen { from { background-position: 120% 0; } to { background-position: -100% 0; } }

@media (max-width: 1100px) { .stage { grid-template-columns: minmax(0, 1fr) 400px; } .roar { width: 88px; } .streak span { display: none; } }
@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; gap: 12px; }
  .slot { height: 30vh; min-height: 180px; max-height: 360px; }
  .board { grid-template-columns: minmax(0,1fr) auto; gap: 10px 12px; }
  .brand { grid-area: 1 / 1; } .score { grid-area: 1 / 2; }
  .pips { grid-area: 2 / 1 / 3 / 3; justify-content: flex-start; } .streak { grid-area: 2 / 1 / 3 / 3; justify-self: end; }
}
@media (max-width: 600px) {
  body { font-size: 14px; }
  h1 { font-size: 26px; line-height: 1.1; }
  h2 { font-size: 18px; }
  p { font-size: 13px; }
  .board { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 6px 10px; }
  .brand { grid-area: 1 / 1; min-width: 0; }
  .pips { grid-area: 2 / 1 / 3 / 3; gap: 3px; justify-content: flex-start; }
  .score { grid-area: 1 / 2; gap: 4px; align-items: center; }
  .streak { grid-area: 2 / 2; justify-self: end; }
  .brand-name { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand svg { width: 22px; height: 22px; }
  .brand-sub { font-size: 7px; }
  .roar { display: none; }
  .pts-box { text-align: right; }
  .pts-box .num { font-size: 18px; padding: 3px 4px; }
  .icon-btn { width: 30px; height: 30px; font-size: 12px; }
  .pip { width: 18px; height: 18px; font-size: 8px; }
  .streak { padding: 4px 6px; font-size: 7px; }
  .streak span { display: none; }
  .streak b { font-size: 11px; }
  .panel { padding: 10px; max-width: 100%; box-sizing: border-box; }
  .btn.big { font-size: 16px; padding: 11px 18px; }
  .btn { font-size: 13px; padding: 9px 14px; }
  .muted { font-size: 11px; }
  .eyebrow { font-size: 9px; }
  details.ans summary { grid-template-columns: 18px minmax(0,1fr) 10px; gap: 6px; padding: 6px 8px; }
  details.ans .q b { font-size: 13px; }
  details.ans .q small { font-size: 11px; }
  details.ans .t { grid-column: 2; grid-row: 2; text-align: left; font-size: 9px; }
  details.ans .t em { display: inline; margin-left: 3px; }
  details.ans .chev { grid-column: 3; grid-row: 1; width: 10px; height: 10px; }
  .alist .tn { display: none; }
  .alist li { grid-template-columns: 5px minmax(0,1fr) auto; gap: 6px; padding: 2px 4px; font-size: 12px; }
  .stats { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; }
  .stats div { padding: 8px; }
  .stats b { font-size: 15px; }
  .stats span { font-size: 8px; }
  .count-chip { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .btn::after { content: none; }
}
